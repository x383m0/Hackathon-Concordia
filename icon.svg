<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 240 270" width="240" height="270" role="img" aria-label="Shield with a magnifying glass in front of a stack of files" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Files behind the shield, fanned out from a low pivot -->
  <g transform="rotate(-22 120 130)">
    <rect x="70" y="-10" width="100" height="140" rx="6" fill="#d5e2f0" stroke="#8aa4c0" stroke-width="2"/>
    <line x1="84" y1="0" x2="156" y2="0" stroke="#8aa4c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="10" x2="140" y2="10" stroke="#8aa4c0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="rotate(22 120 130)">
    <rect x="70" y="-10" width="100" height="140" rx="6" fill="#e8eef5" stroke="#8aa4c0" stroke-width="2"/>
    <line x1="84" y1="0" x2="156" y2="0" stroke="#8aa4c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="10" x2="140" y2="10" stroke="#8aa4c0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="70" y="-10" width="100" height="140" rx="6" fill="#ffffff" stroke="#8aa4c0" stroke-width="2"/>
    <line x1="84" y1="0" x2="156" y2="0" stroke="#8aa4c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="10" x2="140" y2="10" stroke="#8aa4c0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Shield (shifted right so the files can peek out on both sides) -->
  <g transform="translate(20 0)">
    <path d="M100 10 L180 40 V110 C180 170 140 210 100 230 C60 210 20 170 20 110 V40 Z"
          fill="#1e3a5f" stroke="#0f2238" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 22 L168 48 V110 C168 162 133 198 100 216 C67 198 32 162 32 110 V48 Z"
          fill="none" stroke="#5b8cc4" stroke-width="2"/>

    <!-- Magnifying glass -->
    <circle cx="92" cy="102" r="26" fill="#5b8cc4" fill-opacity="0.25" stroke="#ffffff" stroke-width="7"/>
    <line x1="111" y1="121" x2="136" y2="146" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M78 98 A15 15 0 0 1 91 87" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
