<!DOCTYPE html>

<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="extension.css">
</head>

  <body>
  <div class="horizontal">
  <img src="icon.png" alt="Logo" class="top-img">
  <div>
    <h2 class="top-title"> FinePrint </h2>
    <p class="top-subtitle"> Because nobody reads the terms </p>
  </div>
  </div>
  
  <div class="middle">
    <h3> Settings </h3>
    <div class="horizontal">
      <h4> On/Off </h4>
      <label class="switch">
      <input type="checkbox" id="toggleEtat">
      <span class="slider"></span>
      </label>
    </div>
    <div class="horizontal">
      <h4> Eng/Fr </h4>
      <label class="switch">
      <input type="checkbox" id="toggleLangue">
      <span class="slider"></span>
      </label>
    </div>
    <div class="horizontal">
      <h4> API Key : </h4>
      <input placeholder="..." type="text" id="api">
    </div>
  </div>

  <div class="bottom">
  <div class="gauge">
  <svg viewBox="0 0 200 120" width="200" height="120">
    <!-- colored zones -->
    <path d="M20 100 A80 80 0 0 1 60 30.72"   fill="none" stroke= "#e53935" stroke-width="16"/>
    <path d="M60 30.72 A80 80 0 0 1 140 30.72" fill="none" stroke="#fbc02d" stroke-width="16"/>
    <path d="M140 30.72 A80 80 0 0 1 180 100"  fill="none" stroke="#4caf50" stroke-width="16"/>

    <!-- needle (drawn pointing left = 0) -->
    <line id="needle" x1="100" y1="100" x2="35" y2="100"
          stroke="#1e3a5f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#1e3a5f"/>
  </svg>
  </div>

  <p id="analyse"></p>
  </div>

  </body>

</html>
